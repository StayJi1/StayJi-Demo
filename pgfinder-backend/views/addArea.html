<%- include('./include/header.html') %>
<div class="main-content">
    <section class="section">
      <div class="section-body">
        <div class="row">
            <div class="col-md-2"></div>
          <div class="col-12 col-md-8 col-lg-9">
            <div class="card">
              <%if(operation=="insert"){%>
              <form action="/admin/addAreaEJS" method="post">
                <div class="card-header">
                  <h4>Insert Area</h4>
                </div>
                <div class="card-body">
                  <div class="form-group">
                    <label>Area Name</label>
                    <input type="text" class="form-control" name="areaName" id="areaName" required="">
                  </div>
                  <div class="form-group">
                    <label>City</label>
                    <select class="form-control" name="cityName" id="cityName">
                      <option>Select</option>
                      <option>Surat</option>
                      <option>Vapi</option>
                      <option>Valsad</option>
                      <option>Navsari</option>
                    </select>
                  </div>
                <div class="card-footer text-center">
                  <button class="btn btn-primary">Submit</button>&nbsp;
                  <button type="reset" class="btn btn-warning">Reset</button>
                </div>
              </form>
              <%}else{%>
                <form action="/admin/updateAreaEJS" method="post">
                  <div class="card-header">
                    <h4>Update Area</h4>
                  </div>
                  <div class="card-body">
                    <input type="hidden" name="id" value="<%=areaData._id%>">
                    <div class="form-group">
                      <label>Area Name</label>
                      <input type="text" class="form-control" name="areaName" id="areaName" value="<%=areaData.areaName%>" required="">
                    </div>
                    <div class="form-group">
                      <label>City</label>
                      <select class="form-control" name="cityName" id="cityName">
                        <option>Select</option>
                        <option value="Surat"
                        <% if(areaData.cityName=="Surat"){ %>
                          selected 
                          <%}%>
                          >Surat</option>
                          <option value="Vapi"
                        <% if(areaData.cityName=="Vapi"){ %>
                          selected 
                          <%}%>
                          >Vapi</option>
                          <option value="Valsad"
                        <% if(areaData.cityName=="Valsad"){ %>
                          selected 
                          <%}%>
                          >Valsad</option>
                        <% if(areaData.cityName=="Navsari"){ %>
                          selected 
                          <%}%>
                          >Navsari</option>
                      </select>
                    </div>
                  <div class="card-footer text-center">
                    <button class="btn btn-primary">Submit</button>&nbsp;
                    <button type="reset" class="btn btn-warning">Reset</button>
                  </div>
                </form>
                <%}%>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
<%- include('./include/footer.html') %>
