<%- include('./include/header.html') %>
<div class="main-content">
    <section class="section">
      <div class="section-body">
        <!-- <a href="/admin/addUserReview" class="btn btn-icon btn-primary" style="width: 100px;"><i class="fas fa-plus"></i></a><br><br> -->
        <div class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-header">
                <h4>User Review</h4>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-striped" id="table-1" >
                    <thead>
                      <tr>
                        <th>No</th>
                        <th>User</th>
                        <th>Property</th>
                        <th>Review</th>
                        <!-- <th>Action</th> -->
                      </tr>
                    </thead>
                    <tbody>
                      <%
                      var n=1;
                      data.forEach(function(key){
                      %>
                      <tr>
                        <td>
                          <%= n++; %>
                        </td>
                        <td>
                          <%= key.user_value; %><br>
                        </td>
                        <td>
                            <b>Name: </b><%= key.property_value; %><br>
                        </td>
                        <td>
                            <b>Rating: </b><button style="background-color: teal;color:white;border-radius: 20%;border: none;"><%= key.rating; %><i class="fas fa-star" style="color: rgb(255, 225, 0);"></i></button><br>
                            <b>Details: </b><%= key.details; %><br>
                        </td>
                        <!-- <td>
                            <a href="#" class="btn btn-icon btn-primary" style="border-radius: 30%;"><i class="fas fa-pencil-alt"></i></a>
                            <a href="#" class="btn btn-icon btn-danger" style="border-radius: 30%;"><i class="fas fa-trash-alt"></i></a>
                        </td> -->
                      </tr>
                      <% }); %>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
        </div>
      </div>
    </section>
  </div>
  <%- include('./include/footer.html') %>
