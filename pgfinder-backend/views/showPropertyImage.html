<%- include('./include/header.html') %>
<div class="main-content">
    <section class="section">
      <div class="section-body">

        <div class="row clearfix">
          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 col-12">

              <div class="card-header">
                <h4>Property Images</h4>
              </div>
              
              <div class="card-body">
               
                <div id="aniimated-thumbnials" class="list-unstyled row clearfix">

              %>

                        z-index:0;

                      </a>

                      z-index:0;
                      top:-46px;border-radius: 5%;" /><span style="position: absolute; top: 50px; left: 50px; color: white;font-family: Fantasy;text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;font-size: 30px;"><%= key.property_value; %></span>
                    </a> -->
                    
                  </div>
                  <% }) %>
                </div>
             
              </div>
             
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <%- include('./include/footer.html') %>
  <!------------------ Model -------------------------->
  <%  data.forEach(function(key){ %>
    <div class="modal fade" id="modalDelete<%= key._id; %>" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Do You Really Want To Delete?</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        
          <form method="post" action="/admin/deletePropertyImage">
            <input type="hidden" name="id" value="<%=key._id%>" />
            <input type="hidden" name="propertyIDFK" value="<%=propertyData%>" id="propertyIDFK" />
            <div class="modal-footer bg-whitesmoke br">
            <button type="submit" class="btn btn-primary">Confirm</button>
            <button type="button" class="btn btn-danger" data-dismiss="modal">Close</button>
            </div>
          </form>
      </div>
    </div>
  </div>
<% }); %>

<!------------------ Model Insert-------------------------->

  <div class="modal fade" id="modalInsert" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Property Images</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      
      
      <form action="/admin/addPropertyImageEJS" method="post" enctype="multipart/form-data">
        <div class="card-body">
          <input type="hidden" name="propertyIDFK" value="<%=propertyData%>" />
          <div class="form-group">
            <label>Property Images</label>
          <div class="custom-file">
            <input type="hidden" value="PropertyImages" id="docimg" name="docimg">
            <input type="file" class="custom-file-input" id="image" name="image" multiple>
            <label class="custom-file-label" for="image">Choose file</label>
          </div>
          </div>
        <div class="card-footer text-center">
          <button class="btn btn-primary">Submit</button>
        </div>
      </form>
    </div>
  </div>
</div>
