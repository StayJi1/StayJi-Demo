<%- include('./include/header.html') %>
<div class="main-content">
    <section class="section">
      <div class="section-body">
        <div class="row">
            <div class="col-md-2"></div>
          <div class="col-12 col-md-8 col-lg-9">
            <div class="card">
              <%if(operation=="insert"){%>
              <form action="/admin/addUserEJS" method="post" enctype="multipart/form-data">
                <div class="card-header">
                  <h4>Insert User</h4>
                </div>
                <div class="card-body">
                  <div class="form-group">
                    <label>User Name</label>
                    <input type="text" class="form-control"  required="" name="userName" id="userName">
                  </div>
                  <div class="form-group">
                    <label>First Name</label>
                    <input type="text" class="form-control"  required="" name="userFname" id="userFname">
                  </div>
                  <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" class="form-control"  required="" name="userLname" id="userLname">
                  </div>

                  <div class="form-group">  
                    <label>Email</label>
                    <div class="input-group">
                    <div class="input-group-prepend">
                      <div class="input-group-text">
                        <i class="fas fa-envelope"></i>
                      </div>
                    </div>
                    <input type="email" class="form-control" required="" name="userEmail" id="userEmail">
                  </div>  
                  </div>
                  <div class="form-group">  
                    <label>Password</label>
                    <div class="input-group">
                    <div class="input-group-prepend">
                      <div class="input-group-text">
                        <i class="fas fa-lock"></i>
                      </div>
                    </div>
                    <input type="password" class="form-control" required="" name="userPassword" id="userPassword">
                  </div>  
                  </div>
                  <div class="form-group">  
                    <label>Birthdate</label>
                    <div class="input-group">
                    <div class="input-group-prepend">
                      <div class="input-group-text">
                        <i class="fas fa-calendar"></i>
                      </div>
                    </div>
                    <input type="date" class="form-control" required="" name="dob" id="dob">
                  </div>  
                  </div>
                  <div class="form-group">
                    <label class="d-block">Gender</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="Male" value="Male">
                        <label class="form-check-label" for="Male">
                          Male
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="Female" value="Female">
                        <label class="form-check-label" for="Female">
                          Female
                        </label>
                    </div>
                  </div>
                  <div class="form-group">  
                    <label>Contact</label>
                    <div class="input-group">
                    <div class="input-group-prepend">
                      <div class="input-group-text">
                        <i class="fas fa-phone"></i>
                      </div>
                    </div>
                    <input type="number" class="form-control" required="" name="contact" id="contact">
                  </div>  
                  </div>
                  <div class="form-group">  
                    <label>Occupation</label>
                    <div class="input-group">
                    <div class="input-group-prepend">
                      <div class="input-group-text">
                        <i class="fas fa-graduation-cap"></i>
                      </div>
                    </div>
                    <input type="text" class="form-control" required="" name="occupation" id="occupation">
                  </div>  
                  </div>
                  <div class="form-group">
                    <label>User Type</label>
                    <select class="form-control" name="userType" id="userType">
                      <option>Select</option>
                      <option>Property Owner</option>
                      <option>Tenant</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Profile</label>
                  <div class="custom-file">
                    <input type="hidden" value="UserImage" id="docimg" name="docimg">
                    <input type="file" class="custom-file-input" id="profile" name="profile">
                    <label class="custom-file-label" for="profile">Choose file</label>
                  </div>
                  </div>
                </div>
                <div class="card-footer text-center">
                  <button class="btn btn-primary">Submit</button>
                </div>
              </form>
              <%}%>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
<%- include('./include/footer.html') %>
